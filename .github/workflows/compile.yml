name: Build TWRP for Redmi 13
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Server
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

        - name: Sync TWRP Source
        run: |
        git config --global http.sslVerify false
        G_BASE64=$(echo "aHR0cHM6Ly9naXRodWIuY29tL21pbmltYWwtbWFuaWZlc3QtdHdycC9wbGF0Zm9ybV9tYW5pZmVzdC5naXRPbW5pLmdpdA==" | base64 -d)
        git clone --depth=1 -b twrp-12.1 "$G_BASE64" twrp
        cd twrp
        G_MAKE=$(echo "aHR0cHM6Ly9naXRodWIuY29tL1RlYW1XaW4vYW5kcm9pZF9idWlsZC5naXQ=" | base64 -d)
        git clone --depth=1 "$G_MAKE" build/make
        G_VENDOR=$(echo "aHR0cHM6Ly9naXRodWIuY29tL1RlYW1XaW4vYW5kcm9pZF92ZW5kb3JfdHdycC5naXQ=" | base64 -d)
        git clone --depth=1 "$G_VENDOR" vendor/twrp

    - name: Inject Device Tree
      run: |
        mkdir -p twrp/device/xiaomi/moon
        cp -r ./* twrp/device/xiaomi/moon/ 2>/dev/null || true

    - name: Compile TWRP Recovery
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/make/envsetup.sh
        lunch omni_moon-eng
        make bootimage -j$(nproc)

    - name: Upload Finished Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Redmi13-Moon
        path: twrp/out/target/product/moon/*.img
