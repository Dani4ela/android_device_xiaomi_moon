name: Build TWRP Recovery (Android 11)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4

    - name: Cleanup Environment
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

        - name: Clone TWRP 11 Source
        run: |
        git config --global http.sslVerify false
        URL_B64=$(echo "aHR0cHM6Ly9naXRodWIuY29tL21pbmltYWwtbWFuaWZlc3QtdHdycC9wbGF0Zm9ybV9tYW5pZmVzdF90d3JwX29tbmkuZ2l0" | base64 -d)
        git clone --depth=1 -b twrp-11.0 "$URL_B64" twrp_source

    - name: Inject Device Tree
      run: |
        mkdir -p twrp_source/device/xiaomi/moon
        cp -r ./* twrp_source/device/xiaomi/moon/ 2>/dev/null || true

    - name: Compile TWRP Image
      run: |
        cd twrp_source
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_moon-eng
        make recoveryimage -j$(nproc)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Redmi13-Moon
        path: twrp_source/out/target/product/moon/*.img
