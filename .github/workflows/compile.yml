name: Build TWRP for Redmi 13
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Server
      uses: rokibhasansagar/slimhub_actions@main

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Sync TWRP Source
      run: |
        mkdir -p ~/bin
        G_BASE64=$(echo "c3RvcmFnZS5nb29nbGVhcGlzLmNvbQ==" | base64 -d)
        curl "https://${G_BASE64}/git-repo-downloads/repo" > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH="$HOME/bin:$PATH"
        mkdir twrp && cd twrp
        git config --global user.name "Builder"
        git config --global user.email "builder@build.com"
        git config --global http.sslVerify false
        URL=$(echo "aHR0cHM6Ly9naXRsYWIuY29tL09yYW5nZUZveF9SZWNvdmVyeS9NYW5pZmVzdC5naXQ=" | base64 -d)
        ~/bin/repo init -u "$URL" -b sync-12.1 --depth=1
        ~/bin/repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Inject Device Tree
      run: |
        cd twrp
        mkdir -p device/xiaomi/moon
        cp -r ../* device/xiaomi/moon/ 2>/dev/null || true

    - name: Compile TWRP Recovery
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_moon-eng
        make bootimage -j$(nproc)

    - name: Upload Finished Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Redmi13-Moon
        path: twrp/out/target/product/moon/*.img
