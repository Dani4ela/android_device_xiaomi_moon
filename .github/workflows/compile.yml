name: Build TWRP for HyperOS (Docker A14)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4

    - name: Run Build in Android 14 Docker
      run: |
        mkdir -p out
        docker run --rm \
          -v ${{ github.workspace }}:/home/builder/twrp/device/xiaomi/moon \
          -v ${{ github.workspace }}/out:/home/builder/twrp/out \
          ghcr.io/twrpdtgen/twrp-builder:14.0 \
          /bin/bash -c "cd /home/builder/twrp && source build/envsetup.sh && lunch omni_moon-eng && make bootimage -j\$(nproc)"

    - name: Upload HyperOS Recovery
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Android14-HyperOS
        path: out/*.img
