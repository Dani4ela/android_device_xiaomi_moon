name: Build TWRP for Redmi 13 (Docker)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4

    - name: Run Build in Docker
      run: |
        mkdir -p out
        docker run --rm \
          -v ${{ github.workspace }}:/home/builder/device/xiaomi/moon \
          -v ${{ github.workspace }}/out:/home/builder/out \
          ghcr.io/twrpdtgen/twrp-builder:12.1 \
          /bin/bash -c "source build/envsetup.sh && lunch omni_moon-eng && make bootimage -j\$(nproc)"

    - name: Upload Finished Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Redmi13-Moon
        path: out/*.img
